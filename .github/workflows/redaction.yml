# Redaction gate for a public repository. CI runs the committed ruleset only:
# organization patterns stay out of version control and still run locally when
# REDACTION_EXTRA_PATTERNS is set.
#
# Runner is ubuntu-latest (Linux). Install pin is Linux-only with sha256sum —
# no dead Darwin branch on a Linux runner.

name: redaction

on:
  pull_request:
  push:
    branches: [main]

jobs:
  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install gitleaks (pinned, checksum verified)
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64)  f=gitleaks_8.30.1_linux_x64.tar.gz;    sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            aarch64) f=gitleaks_8.30.1_linux_arm64.tar.gz;  sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *) echo "unmapped linux arch: $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "$sum  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan tracked content (committed rules)
        run: ./scripts/redaction-scan.sh
      - name: Regression tests for the gate
        run: bash tests/redaction-gate/run.sh
